name: Backfill historique AQI

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Nombre de mois à remonter"
        required: false
        default: "12"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Backfill
        run: python scripts/backfill.py --months ${{ github.event.inputs.months }}

      - name: Reconstruction de clean/
        run: python scripts/build_clean.py

      - name: Validation
        run: python scripts/validate_clean.py

      - name: Chargement warehouse
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/load_warehouse.py

      - name: Commit et push
        run: |
          git config user.name "aqi-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add raw/ clean/
          git diff --staged --quiet || git commit -m "chore(data): backfill historique"
          git push
